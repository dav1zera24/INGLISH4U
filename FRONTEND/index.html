<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação JWT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h2>Exercício Autenticação JWT</h2>
    </header>

    <main class="container">

        <h1>Login</h1>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Usuário"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="login-message"></p>

    </main>

    <footer class="footer">
        <p> @ Desenvolvido por Luiz Koppe</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
